name: "🌙 WhatsApp Nocturno 21:00 • Caballero Jaguar"

on:
  schedule:
    # 20:00 UTC = 21:00 CET (Hora de Alemania en Invierno)
    - cron: '0 20 * * *'
  workflow_dispatch: # Permite probarlo manualmente con 1 clic desde GitHub

jobs:
  send-night-whatsapp:
    name: Enviar Reporte Nocturno 21:00 WhatsApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Motor WhatsApp Green-API
        run: |
          python scripts/daily_night_jaguar_whatsapp.py
